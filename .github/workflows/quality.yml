name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-mssql:
    uses: ./.github/workflows/mssql-native.yml
  release-acceptance:
    name: Release acceptance
    if: ${{ always() }}
    needs: [verify, windows-synthetic, native-mssql]
    runs-on: ubuntu-latest
    steps:
      - name: Require quality, Windows and native MSSQL success for the same commit
        env:
          QUALITY: ${{ needs.verify.result }}
          WINDOWS: ${{ needs.windows-synthetic.result }}
          NATIVE: ${{ needs.native-mssql.result }}
        run: test "$QUALITY" = success && test "$WINDOWS" = success && test "$NATIVE" = success
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run verify
      - run: npm run deploy:verify
      - name: Clean release package acceptance (temporary directory, no database)
        run: node scripts/check-deployment-package.mjs
      - run: npx playwright install --with-deps chromium
      - name: Browser security and draft regression checks (synthetic database)
        run: node scripts/run-browser-checks-isolated.mjs
      - run: npm audit --audit-level=moderate
      - run: npm --prefix frontend audit --audit-level=high
  windows-synthetic:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm --prefix frontend ci
      - name: Shared domain, TypeScript and site build on Windows
        run: npm run check:domain && npm run build && npm run deploy:verify
        shell: cmd
      # Every unit/integration test runs here; a glob keeps new tests from being
      # left out of the Windows run (node --test expands the quoted pattern).
      - name: All unit tests on Windows (sessions, file locks, recovery, rollback, restart, concurrency)
        run: node --test "tests/*.test.mjs" tests/windows-launcher.integration.mjs
      - name: Clean release package acceptance (temporary directory, no database)
        run: node scripts/check-deployment-package.mjs
